<script>
function pad(n){return n.toString().padStart(2,'0');}
document.getElementById('start').addEventListener('click',()=>{
  const days = Number(document.getElementById('days').value);
  const target = new Date();
  target.setDate(target.getDate() + days);
  
  const targetTime = target.getTime();
  const disp = document.getElementById('display');
  function tick(){
    const now = Date.now();
    let diff = targetTime - now;
    if(diff<=0){ disp.textContent = 'Countdown complete!'; clearInterval(iv); return; }
    const d = Math.floor(diff / (1000*60*60*24));
    diff -= d*(1000*60*60*24);
    const h = Math.floor(diff/(1000*60*60)); diff -= h*(1000*60*60);
    const m = Math.floor(diff/(1000*60)); diff -= m*(1000*60);
    const s = Math.floor(diff/1000);
    disp.textContent = d+'d '+pad(h)+':'+pad(m)+':'+pad(s);
  }
  tick();
  const iv = setInterval(tick, 500);
});
</script></body></html>
